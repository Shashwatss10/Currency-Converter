<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link href="style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h2>Currency Converter</h2>
      <form>
        <!-- Amount Section -->
        <div class="amount">
          <label for="amount">Enter Amount</label>

          <input id="amount" type="text" value="1" placeholder="Enter amount" />
        </div>

        <!-- Dropdown Section -->
        <div class="dropdown">
          <!-- FROM -->
          <div class="from">
            <p>From</p>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png" alt="US Flag" />
              <label for="from-currency"></label>
              <select name="from" id="from-currency" title="From Currency">
                <option value="USD">USD</option>
              </select>
            </div>
          </div>
          <!-- Arrow Icon -->
          <i class="fa-solid fa-right-left"></i>
          <!-- TO -->
          <div class="to">
            <p>To</p>
            <div class="select-container">
              <img src="https://flagsapi.com/IN/flat/64.png" alt="India Flag" />
              <label for="to-currency"></label>
              <select name="to" id="to-currency" title="To Currency">
                <option value="INR">INR</option>
              </select>
            </div>
          </div>
        </div>
        <!-- Message -->
        <div class="rate-box">
          <p class="rate-title">🌍 Current Exchange Rate</p>
          <div class="exchange-rate">1 USD = 96 INR</div>
        </div>

        <!-- Button -->
        <button type="submit">Get Exchange Rate</button>

        <!-- Result -->
        <div class="result-box">
          <p class="result-title">💱 Conversion Result</p>
          <div class="msg">0 USD = 0 INR</div>
        </div>
      </form>
    </div>
    <script src="codes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
